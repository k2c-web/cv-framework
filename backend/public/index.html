<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>My Fastify API</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0d0d0d;
      --surface: #161616;
      --border: #2a2a2a;
      --accent: #00ff88;
      --accent-dim: rgba(0,255,136,0.08);
      --text: #f0f0f0;
      --muted: #666;
      --error: #ff4d4d;
      --mono: 'DM Mono', monospace;
      --sans: 'DM Sans', sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      min-height: 100vh;
      padding: 48px 24px;
    }

    header {
      max-width: 860px;
      margin: 0 auto 56px;
      display: flex;
      align-items: center;
      gap: 16px;
      animation: fadeDown 0.5s ease both;
    }

    .logo {
      width: 36px;
      height: 36px;
      border: 2px solid var(--accent);
      border-radius: 8px;
      display: grid;
      place-items: center;
    }

    .logo span {
      width: 12px;
      height: 12px;
      background: var(--accent);
      border-radius: 50%;
      display: block;
    }

    header h1 {
      font-family: var(--mono);
      font-size: 18px;
      font-weight: 500;
      letter-spacing: -0.5px;
      color: var(--text);
    }

    header h1 em {
      color: var(--accent);
      font-style: normal;
    }

    .tag {
      margin-left: auto;
      font-family: var(--mono);
      font-size: 11px;
      color: var(--muted);
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 4px 10px;
      border-radius: 20px;
    }

    main {
      max-width: 860px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
    }

    @media (max-width: 640px) {
      main { grid-template-columns: 1fr; }
    }

    section {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 28px;
      animation: fadeUp 0.5s ease both;
    }

    section:nth-child(2) { animation-delay: 0.08s; }

    section h2 {
      font-family: var(--mono);
      font-size: 13px;
      font-weight: 500;
      color: var(--accent);
      letter-spacing: 0.05em;
      text-transform: uppercase;
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    section h2::before {
      content: '';
      display: block;
      width: 6px;
      height: 6px;
      background: var(--accent);
      border-radius: 50%;
    }

    /* FORM */
    .field {
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-size: 12px;
      font-family: var(--mono);
      color: var(--muted);
      margin-bottom: 8px;
      letter-spacing: 0.05em;
    }

    input {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 14px;
      color: var(--text);
      font-family: var(--sans);
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus {
      border-color: var(--accent);
    }

    input::placeholder { color: var(--muted); }

    button {
      width: 100%;
      margin-top: 8px;
      padding: 13px;
      background: var(--accent);
      color: #000;
      border: none;
      border-radius: 10px;
      font-family: var(--mono);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      letter-spacing: 0.03em;
      transition: opacity 0.2s, transform 0.1s;
    }

    button:hover { opacity: 0.85; }
    button:active { transform: scale(0.98); }
    button:disabled { opacity: 0.4; cursor: not-allowed; }

    .feedback {
      margin-top: 14px;
      font-size: 13px;
      font-family: var(--mono);
      padding: 10px 14px;
      border-radius: 8px;
      display: none;
    }

    .feedback.success {
      display: block;
      background: rgba(0,255,136,0.08);
      color: var(--accent);
      border: 1px solid rgba(0,255,136,0.2);
    }

    .feedback.error {
      display: block;
      background: rgba(255,77,77,0.08);
      color: var(--error);
      border: 1px solid rgba(255,77,77,0.2);
    }

    /* USER LIST */
    .user-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .user-card {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 14px;
      animation: fadeUp 0.3s ease both;
    }

    .avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: var(--accent-dim);
      border: 1px solid rgba(0,255,136,0.2);
      display: grid;
      place-items: center;
      font-family: var(--mono);
      font-size: 13px;
      color: var(--accent);
      flex-shrink: 0;
    }

    .user-info { flex: 1; overflow: hidden; }

    .user-name {
      font-size: 14px;
      font-weight: 500;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .user-email {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--muted);
      margin-top: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .user-id {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--border);
      flex-shrink: 0;
    }

    .empty {
      text-align: center;
      padding: 40px 0;
      color: var(--muted);
      font-family: var(--mono);
      font-size: 13px;
    }

    .refresh-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
      font-size: 12px;
      padding: 6px 14px;
      width: auto;
      margin: 0 0 20px;
      border-radius: 8px;
    }

    .refresh-btn:hover { border-color: var(--accent); color: var(--accent); opacity: 1; }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeDown {
      from { opacity: 0; transform: translateY(-8px); }
      to   { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

<header>
  <div class="logo"><span></span></div>
  <h1>fastify<em>_api</em></h1>
  <span class="tag">localhost:3000</span>
</header>

<main>

  <!-- REGISTER -->
  <section>
    <h2>Nouvel utilisateur</h2>

    <div class="field">
      <label>NOM</label>
      <input id="name" type="text" placeholder="Kamil" />
    </div>
    <div class="field">
      <label>EMAIL</label>
      <input id="email" type="email" placeholder="kamil@example.com" />
    </div>
    <div class="field">
      <label>MOT DE PASSE</label>
      <input id="password" type="password" placeholder="••••••••" />
    </div>

    <button id="register-btn" onclick="registerUser()">Enregistrer</button>
    <div class="feedback" id="register-feedback"></div>
  </section>

  <!-- USER LIST -->
  <section>
    <h2>Utilisateurs</h2>
    <button class="refresh-btn" onclick="loadUsers()">↻ Actualiser</button>
    <div class="user-list" id="user-list">
      <div class="empty">Chargement...</div>
    </div>
  </section>

</main>

<script>
  const API = "http://localhost:3000";

  async function loadUsers() {
    const list = document.getElementById("user-list");
    try {
      const res = await fetch(`${API}/users`);
      const users = await res.json();

      if (!users.length) {
        list.innerHTML = '<div class="empty">Aucun utilisateur enregistré.</div>';
        return;
      }

      list.innerHTML = users.map((u, i) => `
        <div class="user-card" style="animation-delay:${i * 0.05}s">
          <div class="avatar">${u.name[0].toUpperCase()}</div>
          <div class="user-info">
            <div class="user-name">${u.name}</div>
            <div class="user-email">${u.email}</div>
          </div>
          <div class="user-id">#${u.id}</div>
        </div>
      `).join("");
    } catch {
      list.innerHTML = '<div class="empty" style="color:#ff4d4d">Impossible de contacter l\'API.</div>';
    }
  }

  async function registerUser() {
    const btn = document.getElementById("register-btn");
    const feedback = document.getElementById("register-feedback");
    const name = document.getElementById("name").value.trim();
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    feedback.className = "feedback";
    feedback.textContent = "";

    if (!name || !email || !password) {
      feedback.className = "feedback error";
      feedback.textContent = "Tous les champs sont requis.";
      return;
    }

    btn.disabled = true;
    btn.textContent = "Envoi...";

    try {
      const res = await fetch(`${API}/register`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ name, email, password }),
      });

      const data = await res.json();

      if (!res.ok) {
        throw new Error(data.message || "Erreur serveur");
      }

      feedback.className = "feedback success";
      feedback.textContent = `✓ ${data.name} enregistré avec succès (id: ${data.id})`;

      document.getElementById("name").value = "";
      document.getElementById("email").value = "";
      document.getElementById("password").value = "";

      loadUsers();
    } catch (err) {
      feedback.className = "feedback error";
      feedback.textContent = err.message.includes("Unique") ? "Email ou nom déjà utilisé." : err.message;
    } finally {
      btn.disabled = false;
      btn.textContent = "Enregistrer";
    }
  }

  loadUsers();
</script>
</body>
</html>
