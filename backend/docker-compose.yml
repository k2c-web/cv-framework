version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: fastify_sandbox_db
    restart: always
    environment:
      POSTGRES_USER: kamil
      POSTGRES_PASSWORD: tonpassword
      POSTGRES_DB: mydb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
